<div class="page">
  <div class="header">
    <h1>Mes tâches</h1>
    <button (click)="logout()">Déconnexion</button>
  </div>

  <div class="create-box">
    <input [(ngModel)]="title" placeholder="Titre de la tâche" />
    <textarea [(ngModel)]="description" placeholder="Description"></textarea>
    <button (click)="createTask()">Ajouter</button>
  </div>

  <div class="task-list">
    <div class="task-card" *ngFor="let task of tasks">
      <h3>{{ task.title }}</h3>
      <p>{{ task.description }}</p>
      <p><strong>Statut :</strong> {{ task.completed ? 'Terminée' : 'En cours' }}</p>

      <div class="actions">
        <button *ngIf="!task.completed" (click)="completeTask(task.id)">
          Terminer
        </button>
        <button (click)="deleteTask(task.id)">Supprimer</button>
      </div>
    </div>
  </div>
</div>
