server.port=8081
spring.application.name=auth-service

spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

security.token.secret=taskmanager-secret-key-2026
security.token.expiration-seconds=3600
Ton backend prévu place auth-service sur le port 8081 avec H2, une clé de signature et une durée d?expiration du token.
